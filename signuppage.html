<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Meesho</title>
     <link rel="icon" class="logo" type="image/png" href="./WhatsApp Image 2026-09-03 at 7.38.46 PM.jpeg">
    <link rel="stylesheet" href="signUp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="header">
        <div > 
            <img class="meeshologo" src="https://www.meesho.com/assets/svgicons/meeshoLogo.svg">
        </div>
        <div>
            <input class="searchbar" type="text" placeholder="Try Saree, Kurti or Search by Product Code"> 
        </div>
        <div  class="become">
            <p>Become a Supplier</p>
        </div>
        <div class="investor">
            <p >Investor Relations</p>
        </div>
    </div>
    <div class="signUpPage">
        <div class="mainPage">
            
                <img src="https://images.meesho.com/images/marketing/1661417516766.webp">
            <div class="signUpdetails">
                <h3>Sign Up to view your profile</h3><br>
                <span>Country</span><br><br>
                <p>In +91</p>
                
                <input type="search" placeholder="Phone Number" id="mobileNumber">
                <p id="numberError"></p>
                <button id="verifyBtn">Verify</button>
            </div>
            <div class="conditions"> By continuing, you agree to Meesho’s <br> <span>Terms & Conditions </span> and<span>Privacy Policy</span></div>

        </div>
    </div>
    <div id="verifyPopup">Verified</div>
    <script src="signup.js"></script>
</body>
</html>
