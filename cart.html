<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Checkout</title>
     <link rel="icon" class="logo" type="image/png" href="./WhatsApp Image 2026-09-03 at 7.38.46 PM.jpeg">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
   
</head>
<body>
    <div class="header">
        <a href="index.html"><img src="https://www.meesho.com/assets/svgicons/meeshoLogo.svg"></a>
    </div>
    <div class="main-container">
        <div class="product-details">
            <p>Product Details</p>
            <div>
                <img src="">
                <p id="productName"></p>
                <p id="productAmount"></p>
                <span id="productSize"></span>
                <span id="quantatity"></span>
            </div>
        </div>

            
                <div class="price-details">
                    <p class="topics">Price Details(<span id="itemCount">0 </span>)Items</p>

                    <div class="price">
                    <span class="product-price">Product Price</span>
                    <span id="productPrice"></span>
                    </div>

                    <div class="discount">
                    <span class="total-discount">Total Discount </span>
                    <span id="totalDiscount">-₹0</span>
                    </div>

                    <hr>

                    <div class="total">
                        <span class="order-total">Order Total</span>
                        <span id="orderTotal"></span>
                    </div>
                    <div class="image-total">
                        <img src="https://images.meesho.com/images/marketing/1657272960496.webp">
                        <span>Yay! Your total discount is <span></span></span>
                    </div>
                    <div class="continue">
                        <p>Clicking on 'Continue' will not deduct any money</p>
                        <button>  Continue  </button>
                    </div>
                    <div class="last-image">
                        <img src="https://images.meesho.com/images/marketing/1588578650850.webp">
                    </div>
                </div>
            
    </div>






    <script src="cart.js"></script>
</body>
</html>
