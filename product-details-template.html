<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <link rel="stylesheet" href="product-details-template.css">
</head>

<body>

<!-- HEADER -->
<header>
    <h2>Meesho</h2>

    <input type="search"
           class="searchbar"
           placeholder="Try Saree, Kurti or Search by Product Code">

    <span>Become a supplier</span>
    <span>Investor Relations</span>

    <a href="index.html">Home</a>
    <a href="cart.html">
        <i class="fa-solid fa-cart-shopping"></i> Cart
    </a>
</header>


<!-- PRODUCT DETAILS -->

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="product-side">

        <div class="product-image">
            <img id="productImage" src="" alt="Product">
        </div>

        <button class="add-to-cart" id="addToCart">
            <i class="fa-solid fa-cart-shopping"></i>
            Add to Cart
        </button>

        <button class="buynow" id="buyNow">
            >> Buy Now
        </button>

    </div>


    <!-- RIGHT SIDE -->
    <div class="details-side">

        <!-- PRICE -->
        <div class="price-details">

            <p id="productName"></p>

            <span class="price" id="productPrice"></span>

            <span class="icon">
                <i class="fa-solid fa-circle-info"></i>
            </span>

            <br><br>

            <button id="productRating">
                0.0 <i class="fa-solid fa-star"></i>
            </button>

            <span class="reviews" id="productReviews">
                0 Ratings, 0 Reviews
            </span>

        </div>


        <!-- SIZE -->
        <div class="size">

            <h3>Select Size</h3>

            <div id="sizeButtons"></div>

        </div>


        <!-- PRODUCT HIGHLIGHTS -->
        <div class="highlight">

            <h3>Product Highlights</h3>

            <div class="firstRow">

                <div>
                    <span>Category</span>
                    <p id="productCategory">-</p>
                </div>

                <div>
                    <span>Size</span>
                    <p id="productSize">-</p>
                </div>

            </div>

            <div class="secondRow">

                <div>
                    <span>Description</span>
                    <p id="productDescription">-</p>
                </div>

            </div>

        </div>


        <!-- SELLER -->
        <div class="seller">

            <div class="shop-image">
                <i class="fa-solid fa-store"></i>
            </div>

            <div>

                <div class="seller-info">

                    <h3 id="sellerName">
                        Seller
                    </h3>

                    <button>
                        View Shop
                    </button>

                </div>

                <p>
                    <i class="fa-solid fa-phone"></i>
                    <span id="sellerMobile"></span>
                </p>

                <p>
                    <i class="fa-solid fa-envelope"></i>
                    <span id="sellerEmail"></span>
                </p>

                <p>
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="sellerAddress"></span>
                </p>

            </div>

        </div>

    </div>

</div>


<!-- POPUP -->

<div id="cartToast"></div>
     <div id="loadingScreen">
    <div class="loader">m</div>
    
    </div>


<script src="product-details-template.js"></script>

</body>
</html>
