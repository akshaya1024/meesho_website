<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Products in Meesho</title>
     <link rel="icon" class="logo" type="image/png" href="./WhatsApp Image 2026-09-03 at 7.38.46 PM.jpeg">
    <link rel="icon" class="logo" type="image/png" href="./WhatsApp Image 2026-09-03 at 7.38.46 PM.jpeg">
    <link rel="stylesheet" href="addProduct.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

     <div class="headerPage">
        <div>
            <img src="https://supplier.meesho.com/images/logo.svg">
        </div>
        
        <span>Go To Main Page</span>
        <a href="index.html">
        <button type="button" class="btn btn-outline-primary">Meesho</button>
        </a>
    </div>


    <div class="container">

        <h1>Add Product</h1>
        <p class="subtitle">Enter your product details</p>

        <form id="productForm">

            <!-- Product Image -->

            <div class="form-group">

                <label for="productImage">
                    Product Image
                </label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*"
                    required
                >

                <div class="preview-box">

                    <img
                        id="previewImage"
                        alt="Product Preview"
                    >

                    <span id="previewText">
                        Image preview
                    </span>

                </div>

            </div>


            <!-- Product Name -->

            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <!-- Price + Category -->

            <div class="form-row">

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="₹ Enter price"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option>Women</option>
                        <option>Men</option>
                        <option>Kids</option>
                        <option>Home Decor</option>
                        <option>Home & Kitchen</option>
                        <option>Beauty</option>
                        <option>Jewellery</option>
                        <option>Bags</option>
                       


                    </select>

                </div>

            </div>


            <!-- Size -->

            <div class="form-group">

                <label for="size">
                    Size
                </label>

                <input
                    type="text"
                    id="size"
                    placeholder="Example: S, M, L, XL"
                >

            </div>
                    <div class="form-group">
            <label for="rating">Product Rating</label>
            <input
                type="number"
                id="rating"
                placeholder="Enter rating (1.0 - 5.0)"
                min="1"
                max="5"
                step="0.1"
                required
            >
        </div>

        <div class="form-group">
            <label for="reviews">Reviews</label>
            <input
                type="number"
                id="reviews"
                placeholder="Enter number of reviews"
                min="0"
                required
            >
        </div>
        

            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Colour
                </label>

                <textarea
                    id="description"
                    placeholder="Enter product Colour"
                    rows="1"
                ></textarea>

            </div>
            <h2>Seller Details</h2>

            <div class="form-group">
                <label for="sellerName">Seller Name</label>
                <input
                    type="text"
                    id="sellerName"
                    placeholder="Enter seller name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sellerMobile">Mobile Number</label>
                <input
                    type="tel"
                    id="sellerMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sellerEmail">Email</label>
                <input
                    type="email"
                    id="sellerEmail"
                    placeholder="Enter email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sellerAddress">Seller Address</label>
                <textarea
                    id="sellerAddress"
                    placeholder="Enter seller address"
                    rows="3"
                    required
                ></textarea>
            </div>

           

            <button type="submit" id="addProductBtn">
                Add Product
            </button>

        </form>


        <!-- Success Popup -->

        <div id="successPopup">
            Product added successfully!
        </div>

    </div>


    <script src="addProduct.js"></script>

</body>
</html>
